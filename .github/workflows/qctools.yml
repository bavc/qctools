    - name: Build and install zlib
      shell: cmd
      run: |
        git clone --depth 1 https://github.com/madler/zlib ../zlib-dev
        cd ../zlib-dev
        mkdir build
        cd build
        cmake -G "Unix Makefiles" ^
              -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\..\zlib" ^
              -DBUILD_SHARED_LIBS=0 ^
              -DCMAKE_BUILD_TYPE=Release ^
              ..
        make install

    - name: Install Qt 5.15
      uses: jurplel/install-qt-action@v3
      with:
        arch: win64_mingw81
        version: ${{ matrix.qt_version }}

    - name: Install FFmpeg
      shell: pwsh
      run: |
        Set-Location ..
        $ffmpeg_url = "https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Dev_9.0.1_Windows_Shared_x64.zip"
        Invoke-WebRequest -Uri "$ffmpeg_url" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"

    - name: Download and configure qwt
      shell: bash
      run: |
        git clone --branch qwt-6.3 --depth 1 https://git.code.sf.net/p/qwt/git ../qwt
        cp .github/workflows/qwtconfig.pri ../qwt
        cd ../qwt
