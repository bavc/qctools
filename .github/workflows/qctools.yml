name: qctools

on: [push, pull_request]

jobs:

  build-macos-brew:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Checkout submodules
      shell: bash
      run: |
        set -x
        GIT_PATH=https://github.com/.extraheader
        AUTH_HEADER="$(git config --local --get http.$GIT_PATH)"
        git submodule sync --recursive
        git -c "http.extraheader=$AUTH_HEADER" \
            -c protocol.version=2 \
            submodule update --init --force --recursive --remote --depth=1
        git -C Project/QtCreator/qctools-QtAVPlayer apply -p2 "$PWD"/Project/BuildAllFromSource/qtavplayer-*.patch


    - name: Install dependencies
      run: |
        brew install pkg-config ffmpeg@9 qt@5

    - name: Install qwt-qt5
      run: |
        curl -L https://raw.githubusercontent.com/Homebrew/homebrew-core/56cd02e96876d1fb5b9ae951d605585fe8d614de/Formula/qwt.rb -o /opt/homebrew/Library/Taps/homebrew/homebrew-core/Formula/q/qwt.rb
        git -C /opt/homebrew/Library/Taps/homebrew/homebrew-core add Formula/q/qwt.rb
        git -C /opt/homebrew/Library/Taps/homebrew/homebrew-core commit -m "Formula/q/qwt.rb 6.2.0 for Qt5"
        HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew install qwt

    - name: Set Qt5 environment path
      run: |
        echo `brew --prefix qt@5`/bin >> $GITHUB_PATH

    - name: Check Qt install
      run: |
        qmake -v

    - name: Build QCTools
      env:
        USE_BREW: true
      run: |
        cd Project/QtCreator
        sed -i '' 's/std::atomic_bool abortRequest = false;/std::atomic_bool abortRequest{false};/g' qctools-QtAVPlayer/src/QtAVPlayer/qavdemuxer.cpp || true # temporary fix
        sed -i '' 's/std::atomic_bool m_abort = false;/std::atomic_bool m_abort{false};/g' qctools-QtAVPlayer/src/QtAVPlayer/qavformatcontext_p.h || true # temporary fix
        mkdir build
        cd build
        export PKG_CONFIG_PATH="/opt/homebrew/opt/ffmpeg@9/lib/pkgconfig"
        qmake ..
        make -j4

  build-macos-brew-Qt6:
    runs-on: macos-latest

    env: { 'HOMEBREW_NO_INSTALL_CLEANUP': '1', 'HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK': '1' }

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Checkout submodules
      shell: bash
      run: |
        GIT_PATH=https://github.com/.extraheader
        AUTH_HEADER="$(git config --local --get http.$GIT_PATH)"
        git submodule sync --recursive
        git -c "http.extraheader=$AUTH_HEADER" \
            -c protocol.version=2 \
            submodule update --init --force --recursive --remote --depth=1
        git -C Project/QtCreator/qctools-QtAVPlayer apply -p2 "$PWD"/Project/BuildAllFromSource/qtavplayer-*.patch

    - name: Install dependencies
      run: |
        brew install pkg-config ffmpeg@9 qt vulkan-headers

    - name: Install qwt
      run: |
        brew install --ignore-dependencies qwt

    - name: Set Qt6 environment path
      run: |
        echo `brew --prefix qt`/bin >> $GITHUB_PATH

    - name: Check Qt install
      run: |
        qmake -v

    - name: Build QCTools
      env:
        USE_BREW: true
      run: |
        cd Project/QtCreator
        sed -i '' 's/#if QT_VERSION < QT_VERSION_CHECK(6, 4, 0)/#if QT_VERSION >= QT_VERSION_CHECK(6, 0, 0)/g' qctools-QtAVPlayer/src/QtAVPlayer/qavvideoframe.cpp || true # temporary fix
        mkdir build
        cd build
        export PKG_CONFIG_PATH="/opt/homebrew/opt/ffmpeg@9/lib/pkgconfig"
        qmake ..
        make -j4

  build-macos-no-brew:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Checkout submodules
      shell: bash
      run: |
        GIT_PATH=https://github.com/.extraheader
        AUTH_HEADER="$(git config --local --get http.$GIT_PATH)"
        git submodule sync --recursive
        git -c "http.extraheader=$AUTH_HEADER" \
            -c protocol.version=2 \
            submodule update --init --force --recursive --remote --depth=1
        git -C Project/QtCreator/qctools-QtAVPlayer apply -p2 "$PWD"/Project/BuildAllFromSource/qtavplayer-*.patch

    - name: Install Qt5
      run: |
        brew install qt@5

    - name: Set Qt5 environment path
      run: |
        echo `brew --prefix qt@5`/bin >> $GITHUB_PATH

#    - name: Install Qt5
#      uses: jurplel/install-qt-action@v3
#      with:
#        version: ${{ matrix.qt_version }}
#        modules: ${{ matrix.qt_modules }}

    - name: Check Qt install
      run: |
        qmake -v

    - name: Build qwt
      run: |
        git clone --branch qwt-6.3 --depth 1 https://git.code.sf.net/p/qwt/git ../qwt
        cd ../qwt
        qmake -r
        make -j4

    - name: Install FFmpeg
      run: |
        mkdir -p ../ffmpeg
        curl -fL https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Dev_9.0.1_Mac_Shared_universal.zip -o ../ffmpeg-dev.zip
        curl -fL https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Bin_9.0.1_Mac_Shared_universal.zip -o ../ffmpeg-bin.zip
        unzip -oq ../ffmpeg-dev.zip -d ../ffmpeg
        unzip -oq ../ffmpeg-bin.zip -d ../ffmpeg

    - name: Build QCTools
      env:
        USE_BREW: false
      run: |
        cd Project/QtCreator
        sed -i '' 's/std::atomic_bool abortRequest = false;/std::atomic_bool abortRequest{false};/g' qctools-QtAVPlayer/src/QtAVPlayer/qavdemuxer.cpp || true # temporary fix
        sed -i '' 's/std::atomic_bool m_abort = false;/std::atomic_bool m_abort{false};/g' qctools-QtAVPlayer/src/QtAVPlayer/qavformatcontext_p.h || true # temporary fix
        mkdir build
        cd build
        qmake ..
        make -j4

  build-macos-no-brew-Qt6:

    strategy:
      matrix:
        include:
          - qt_version: "6.12.*"
            qt_modules: "qtmultimedia"

    runs-on: macos-latest

    env: { 'HOMEBREW_NO_INSTALL_CLEANUP': '1', 'HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK': '1' }

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Checkout submodules
      shell: bash
      run: |
        GIT_PATH=https://github.com/.extraheader
        AUTH_HEADER="$(git config --local --get http.$GIT_PATH)"
        git submodule sync --recursive
        git -c "http.extraheader=$AUTH_HEADER" \
            -c protocol.version=2 \
            submodule update --init --force --recursive --remote --depth=1
        git -C Project/QtCreator/qctools-QtAVPlayer apply -p2 "$PWD"/Project/BuildAllFromSource/qtavplayer-*.patch

    - name: Install dependencies
      run: |
        brew install vulkan-headers

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ matrix.qt_version }}
        modules: ${{ matrix.qt_modules }}

    - name: Check Qt install
      run: |
        qmake -v

    - name: Build qwt
      run: |
        git clone --branch qwt-6.3 --depth 1 https://git.code.sf.net/p/qwt/git ../qwt
        cd ../qwt
        sed -i '' 's/^QWT_CONFIG     += QwtOpenGL$/QWT_CONFIG     -= QwtOpenGL/g' qwtconfig.pri
        cat qwtconfig.pri
        qmake -r "QMAKE_CXXFLAGS+=-include arm_acle.h"
        make -j4

    - name: Install FFmpeg
      run: |
        mkdir -p ../ffmpeg
        curl -fL https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Dev_9.0.1_Mac_Shared_universal.zip -o ../ffmpeg-dev.zip
        curl -fL https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Bin_9.0.1_Mac_Shared_universal.zip -o ../ffmpeg-bin.zip
        unzip -oq ../ffmpeg-dev.zip -d ../ffmpeg
        unzip -oq ../ffmpeg-bin.zip -d ../ffmpeg

    - name: Build QCTools
      env:
        USE_BREW: false
      run: |
        cd Project/QtCreator
        mkdir build
        cd build
        qmake INCLUDEPATH+=/opt/homebrew/include ..
        make -j4

  build-linux:

    strategy:
      matrix:
        include:
          - packages: gcc g++ libbz2-dev
            qt_version: "5.15.*"
            qt_packages: "libxkbcommon-dev libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Checkout submodules
      shell: bash
      run: |
        GIT_PATH=https://github.com/.extraheader
        AUTH_HEADER="$(git config --local --get http.$GIT_PATH)"
        git submodule sync --recursive
        git -c "http.extraheader=$AUTH_HEADER" \
            -c protocol.version=2 \
            submodule update --init --force --recursive --remote --depth=1
        git -C Project/QtCreator/qctools-QtAVPlayer apply -p2 "$PWD"/Project/BuildAllFromSource/qtavplayer-*.patch

    - name: Install Python 3.x version
      uses: actions/setup-python@v1
      with:
        python-version: '3'
        architecture: 'x64'

    - name: Install compiler and FFmpeg dependencies
      run: |
        sudo apt-get update &&
        sudo apt-get install -y ${{ matrix.packages }} ${{ matrix.qt_packages }}

    - name: Install Qt 5.15
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ matrix.qt_version }}

    - name: Cleanup
      run: |
        sudo apt-get clean -y
        sudo rm -rf /var/lib/apt/lists/*

    - name: Build qwt
      run: |
        git clone --branch qwt-6.3 --depth 1 https://git.code.sf.net/p/qwt/git ../qwt
        cd ../qwt
        qmake -r
        make -j4

    - name: Build FFmpeg
      run: |
        git clone --depth 1 --branch n9.0.1 https://github.com/FFmpeg/FFmpeg ../ffmpeg
        cd ../ffmpeg
        ./configure --enable-gpl \
                    --enable-shared \
                    --disable-static \
                    --disable-autodetect \
                    --disable-securetransport \
                    --disable-videotoolbox \
                    --disable-doc \
                    --disable-ffplay \
                    --disable-ffprobe \
                    --disable-debug \
                    --disable-x86asm

        make -j12

    - name: Build QCTools
      run: |
        cd Project/QtCreator
        qmake
        make -j4

